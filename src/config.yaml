# Single source of truth for the CAD survival pipeline. All relative paths are resolved against the folder that contains main.py.
paths:
  raw_data: data/classification_bonus_practice_data.csv
  output_dir: outputs_prod                 # production run never writes into ./outputs (the notebook's results)
  notebook_reference_dir: outputs          # read-only: baseline_results.csv, best_params.json, final_results.json from the notebook run
  checkpoint_subdir: checkpoints
  ledger_file: ledger.json
outputs:                                   # file names inside output_dir
  baseline_results: baseline_results.csv
  tuned_results: tuned_results.csv
  final_results: final_results.csv
  final_results_json: final_results.json
  best_params: best_params.json
  test_predictions: test_predictions.csv
  split_ids: split_ids.csv
  final_model: final_model.pkl
  manifest: run_manifest.json
target:
  name: Survive
  label_map: {"0": 0, "1": 1, "No": 0, "Yes": 1}      # four spellings of two classes
  positive_class: 1
patient_key:                               # replicated-patient finding: ~230 patients x ~65 rows; rows of one key must never be split
  columns: [Age, Sodium, Gender]
  abs_columns: [Age]                       # |Age| (sign flips)
columns:
  drop: [ID, Favorite color]               # ID: non-unique, no signal; colour: eta2 0.0005
  raw_feature_exclude: [patient]
cleaning:
  smoke_case: capitalize
  ejection_fraction_map: {L: Low, N: Normal}
  age_abs: true                            # 430 negative ages are sign flips
  platelet_sentinel: 263358.03             # fill value -> NaN (1,245 rows)
  cpk_sentinel: 582                        # fill value -> NaN (2,331 rows)
  suspect_indicators: []                   # [Creatinine_missing, Platelets_sentinel, CPK_sentinel] are outcome-dependent: OFF in the main workflow
  suspect_indicator_candidates: [Creatinine_missing, Platelets_sentinel, CPK_sentinel]
feature_engineering:
  skew_threshold: 1.0                      # log1p columns learned in fit
  log_candidates: [Creatinine, Platelets, Creatine phosphokinase]
  bmi_cut: 33.0
  creat_cut: 1.5
preprocessing:
  winsor_lower: 0.005
  winsor_upper: 0.995
  impute_strategy: median
  scaler: standard
  categorical_encoding: onehot_handle_unknown_ignore
split:
  n_group_folds: 20
  train_folds: 14
  val_folds: 3
  test_folds: 3
  seed: 42
  stratified: true
tuning:
  scoring: average_precision
  cv_folds: 3
  halving: {min_resources: 300, factor: 3, n_candidates: 27, resource: n_samples}   # rungs 300 -> 900 -> 2700 -> 8100
  n_jobs: 1
  blas_threads: 1
  pipeline_version: v1
metrics: [accuracy, precision, recall, f1, roc_auc, pr_auc]
selection: {primary: pr_auc, tie_break: log_loss, candidates: [default, tuned]}   # fixed before tuning
bootstrap: {n: 1000, seed: 42, unit: patient}
reproduction: {rtol: 1.0e-6, atol: 1.0e-6}
expected_dims:                             # real-data dimensions checked in the self-test against the notebook
  rows: {train: 10546, val: 2196, test: 2258}
  patient_groups: {train: 163, val: 32, test: 35}
  processed_columns: 23
models:
  Naive:
    class: DummyClassifier
    params: {strategy: most_frequent}
  Logistic:
    class: LogisticRegression
    params: {}
    search: grid
    grid:
      model__C: [0.01, 0.1, 1, 10, 100, 1000]
      model__class_weight: [null, balanced]
  DecisionTree:
    class: DecisionTreeClassifier
    params: {random_state: 42}
    search: halving
    grid:
      model__max_depth: [2, 3, 4, 6, 8, null]
      model__min_samples_leaf: [1, 5, 20, 50, 100]
      model__class_weight: [null, balanced]
  RandomForest:
    class: RandomForestClassifier
    params: {random_state: 42}
    search: halving
    grid:
      model__n_estimators: [100, 200, 400]
      model__max_depth: [3, 5, 8, null]
      model__min_samples_leaf: [1, 5, 20, 50]
      model__max_features: [sqrt, 0.5, 1.0]
      model__class_weight: [null, balanced]
  HistGradientBoosting:
    class: HistGradientBoostingClassifier
    params: {random_state: 42}
    search: halving
    grid:
      model__learning_rate: [0.03, 0.05, 0.1]
      model__max_iter: [50, 100, 200]
      model__max_leaf_nodes: [4, 8, 15]
      model__min_samples_leaf: [20, 50, 100, 200]
      model__l2_regularization: [0.0, 1.0, 10.0]
      model__class_weight: [null, balanced]
  KNN:
    class: KNeighborsClassifier
    params: {}
    search: halving
    grid:
      model__n_neighbors: [5, 15, 31, 61, 101]
      model__weights: [uniform, distance]
      model__p: [1, 2]
